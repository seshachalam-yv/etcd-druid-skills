<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120">
  <defs>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a7f4e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d5c38;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="nodeglow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="420" height="120" rx="10" ry="10" fill="url(#bgGrad)"/>
  <rect width="420" height="120" rx="10" ry="10" fill="none" stroke="#1a7f4e" stroke-width="1" opacity="0.4"/>

  <!-- etcd cluster: three nodes in raft triangle -->
  <!-- Node connections (edges) -->
  <line x1="48" y1="38" x2="88" y2="72" stroke="#1a7f4e" stroke-width="1.5" opacity="0.6"/>
  <line x1="88" y1="72" x2="28" y2="72" stroke="#1a7f4e" stroke-width="1.5" opacity="0.6"/>
  <line x1="28" y1="72" x2="48" y2="38" stroke="#1a7f4e" stroke-width="1.5" opacity="0.6"/>

  <!-- Leader node (top, brighter) -->
  <circle cx="48" cy="38" r="11" fill="url(#nodeGrad)" filter="url(#nodeglow)"/>
  <text x="48" y="43" text-anchor="middle" font-family="monospace" font-size="10" fill="#e6f4ee" font-weight="bold">L</text>

  <!-- Follower node bottom-right -->
  <circle cx="88" cy="72" r="10" fill="#0d5c38" stroke="#1a7f4e" stroke-width="1"/>
  <text x="88" y="77" text-anchor="middle" font-family="monospace" font-size="9" fill="#7ec8a0">F</text>

  <!-- Follower node bottom-left -->
  <circle cx="28" cy="72" r="10" fill="#0d5c38" stroke="#1a7f4e" stroke-width="1"/>
  <text x="28" y="77" text-anchor="middle" font-family="monospace" font-size="9" fill="#7ec8a0">F</text>

  <!-- Operator gear ring around leader -->
  <circle cx="48" cy="38" r="17" fill="none" stroke="#1a7f4e" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>

  <!-- Plugin lightning bolt symbol -->
  <polygon points="112,28 104,56 112,52 108,82 120,50 112,54" fill="#1a7f4e" opacity="0.85" filter="url(#glow)"/>

  <!-- Separator line -->
  <line x1="130" y1="20" x2="130" y2="100" stroke="#1a7f4e" stroke-width="1" opacity="0.3"/>

  <!-- Main title -->
  <text x="148" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="22" font-weight="700" fill="#e6f4ee" letter-spacing="-0.5" filter="url(#glow)">etcd-druid</text>
  <text x="148" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="15" font-weight="400" fill="#7ec8a0" letter-spacing="2">skills</text>

  <!-- Tagline -->
  <text x="148" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="9" fill="#4a9066" letter-spacing="0.5">Claude Code · Kubernetes · Gardener etcd stack</text>
</svg>
