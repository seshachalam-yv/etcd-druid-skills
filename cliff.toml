[remote.github]
owner = "seshachalam-yv"
repo = "etcd-druid-skills"

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.\n
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}\
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
{{ commit.message | upper_first | split(pat="\n") | first | trim }} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/seshachalam-yv/etcd-druid-skills/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}\n
"""
trim = true
output = "CHANGELOG.md"

[git]
conventional_commits = true
filter_unconventional = true
sort_commits = "newest"
tag_pattern = "v[0-9].*"
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Fixes" },
    { message = "^refactor", group = "Refactor" },
    { message = "^docs?", group = "Documentation" },
    { message = "^test", group = "Testing" },
    { message = "^ci", group = "CI / Infrastructure" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore", group = "Miscellaneous" },
]
